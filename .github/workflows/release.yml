name: 构建并发布 Release
run-name: 发布 ${{ github.event.inputs.tag || github.ref_name }} · 构建 APK 与更新说明

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本标签，例如 v0.10
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: 检查、构建与发布
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: 核对版本并显示更新内容
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+(\.[0-9]+){1,2}', tag):
              raise SystemExit('标签必须使用 v0.10 或 v0.0.1 格式')
          source = pathlib.Path('app/build.gradle.kts').read_text()
          version = re.search(r'^val verName = "([^"]+)"$', source, re.M).group(1)
          code = re.search(r'^val verCode = ([0-9]+)$', source, re.M).group(1)
          if tag != f'v{version}':
              raise SystemExit(f'标签 {tag} 与 APK 版本 v{version} 不一致')
          notes = pathlib.Path(f'docs/releases/{version}.md')
          if not notes.is_file() or not notes.read_text().strip():
              raise SystemExit('缺少本版本更新说明')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'RELEASE_VERSION={version}\nRELEASE_NOTES={notes}\nMODULE_TAG={code}-{version}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(notes.read_text() + '\n')
          print(notes.read_text())
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 安装 Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: 恢复发布签名（配置了密钥则使用，否则自动回退 debug 签名）
        env:
          KEYSTORE_BASE64: ${{ secrets.PPX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ppx-release.keystore"
            echo "PPX_KEYSTORE_FILE=$RUNNER_TEMP/ppx-release.keystore" >> "$GITHUB_ENV"
            echo '使用仓库配置的发布签名' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '未配置 PPX_KEYSTORE_BASE64，自动使用 debug 签名构建，无需任何密钥' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 单元测试、Lint 与 Release 构建
        env:
          PPX_STORE_PASSWORD: ${{ secrets.PPX_STORE_PASSWORD }}
          PPX_KEY_ALIAS: ${{ secrets.PPX_KEY_ALIAS }}
          PPX_KEY_PASSWORD: ${{ secrets.PPX_KEY_PASSWORD }}
        run: bash ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon --console=plain

      - name: 验证 APK 签名并生成校验值
        run: |
          apk="app/build/outputs/release-dist/皮友助手-v${RELEASE_VERSION}-release.apk"
          ls -l "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          cd app/build/outputs/release-dist
          mv "皮友助手-v${RELEASE_VERSION}-release.apk" "piyou-assistant-v${RELEASE_VERSION}-release.apk"
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 上传构建报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ env.RELEASE_TAG }}
          path: app/build/reports/
          if-no-files-found: ignore

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ppx-assistant-${{ env.RELEASE_TAG }}
          path: app/build/outputs/release-dist/

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，覆盖更新资产" >> "$GITHUB_STEP_SUMMARY"
            gh release upload "$RELEASE_TAG" app/build/outputs/release-dist/* --clobber
            gh release edit "$RELEASE_TAG" --title "皮友助手 ${RELEASE_VERSION}" --notes-file "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "皮友助手 ${RELEASE_VERSION}" --notes-file "$RELEASE_NOTES" app/build/outputs/release-dist/*
          fi
          printf '\n发布成功：[下载 %s](https://github.com/%s/releases/tag/%s)\n' "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: 同步发布到 LSPosed 收录仓库
        env:
          MODULES_REPO_TOKEN: ${{ secrets.MODULES_REPO_TOKEN }}
        run: |
          if [ -z "$MODULES_REPO_TOKEN" ]; then
            echo '未配置 MODULES_REPO_TOKEN，跳过收录仓库同步' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          repo="Xposed-Modules-Repo/io.github.vs2pk0.piyou"
          if gh -R "$repo" release view "$MODULE_TAG" >/dev/null 2>&1; then
            echo "收录仓库已存在 $MODULE_TAG，跳过" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          GH_TOKEN="$MODULES_REPO_TOKEN" gh release create "$MODULE_TAG" -R "$repo" \
            --title "$RELEASE_VERSION" --notes-file "$RELEASE_NOTES" \
            app/build/outputs/release-dist/*
          printf '\n已同步到 LSPosed 收录仓库：[%s](https://github.com/%s/releases/tag/%s)\n' \
            "$MODULE_TAG" "$repo" "$MODULE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: 清理临时签名
        if: always()
        run: rm -f "$RUNNER_TEMP/ppx-release.keystore"
